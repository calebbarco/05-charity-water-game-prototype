<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffdf5">
    <title>Well Complete! - charity: water</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="success.css">
</head>
<body class="success-page">
    <header class="site-header success-header">
        <a class="wordmark" href="index.html">
            <img src="img/cw_logo.png" alt="charity: water home">
        </a>
    </header>

    <main class="success-layout">
        <section class="success-art" aria-labelledby="success-heading">
            <h1 id="success-heading">Well Complete!</h1>
            <img src="img/success_image.png" alt="A well digger celebrates as clean water flows for a joyful community">
        </section>

        <section class="success-details" aria-label="Your well results">
            <p class="result-statement">You reached <strong id="depth-result">0</strong> ft!</p>
            <p class="result-statement">You got water for <strong id="people-result">0</strong> people!</p>

            <div class="final-score">
                <span>Final total score</span>
                <strong id="score-result">0</strong>
            </div>

            <nav class="success-actions" aria-label="Next steps">
                <a class="success-button home-button" href="index.html">Home</a>
                <button class="success-button next-level-button" type="button" disabled>
                    Next level coming soon
                </button>
            </nav>
        </section>
    </main>

    <script src="success.js"></script>
</body>
</html>
